name: parkingsystem-prod
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-parking_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parking} -d ${POSTGRES_DB:-parking_db}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [psnet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [psnet]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-parkingminio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - miniodata:/data
    networks: [psnet]

  backend:
    build:
      context: ./backend
      # INSTALL_OCR=true در .env.prod → نصب opencv/easyocr در تصویر (پلاک‌خوان داخل کانتینر)
      args:
        INSTALL_OCR: ${INSTALL_OCR:-false}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parking}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-parking_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      # شبیه‌ساز: SQLite مطلق روی volume — فایل نسبی ./sim_parking.db در کانتینر
      # بی‌ثبات است (با هر rebuild پاک می‌شود و گاهی 500 می‌داد)
      SIM_DATABASE_URL: sqlite+aiosqlite:////data/sim_parking.db
    # مهاجرت امن (p0001..p0007) داخل کانتینر و پیش از بوت‌استرپ
    command: sh -c "python -m scripts.migrate_prod_safe && python -m scripts.bootstrap_prod && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    volumes:
      # ماندگاری مدل‌های EasyOCR (فقط وقتی INSTALL_OCR=true — وگرنه بی‌اثر است)
      - easyocr:/root/.EasyOCR
      # دیتابیس شبیه‌ساز — ماندگار روی rebuild
      - simdata:/data
      # JSON جایگاه‌های CAD (خروجی DXF کارفرما) — برای seed خودکار bootstrap و import دستی
      - ./docs/cad:/app/docs/cad:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks: [psnet]

  nginx:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8880}:80"
    depends_on:
      - backend
    networks: [psnet]

volumes:
  pgdata:
  miniodata:
  easyocr:
  simdata:

networks:
  psnet:

